<section class="dark-area" style="padding: 60px 0;">
  <div class="container">
    <div class="form-card">
      <h2>Passwort vergessen</h2>
      <p style="font-size:0.9rem;color:var(--gray-500);margin-bottom:20px;">Gib deine E-Mail-Adresse ein, dann schicken wir dir einen Link zum Zurücksetzen.</p>
      {{alertHtml}}
      <form method="POST" action="/forgot-password">
        <div class="form-group">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email" placeholder="max@beispiel.de" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Link anfordern</button>
      </form>
      <p style="text-align:center; margin-top:20px; font-size:0.9rem;">
        <a href="/login" style="color:var(--primary); font-weight:600;">Zurück zum Login</a>
      </p>
    </div>
  </div>
</section>
