<section class="dark-area" style="padding: 60px 0;">
  <div class="container">
    <div class="form-card">
      <h2>Neues Passwort vergeben</h2>
      {{alertHtml}}
      <form method="POST" action="/reset-password/{{token}}">
        <div class="form-group">
          <label for="password">Neues Passwort</label>
          <input type="password" id="password" name="password" minlength="{{passwordMinlength}}" pattern="{{passwordPattern}}" title="{{passwordHint}}" required>
          <p style="font-size:0.85rem;color:var(--gray-500);margin-top:4px;">{{passwordHint}}</p>
        </div>
        <div class="form-group">
          <label for="password2">Neues Passwort wiederholen</label>
          <input type="password" id="password2" name="password2" minlength="{{passwordMinlength}}" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Passwort speichern</button>
      </form>
    </div>
  </div>
</section>
